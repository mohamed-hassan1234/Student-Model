[project]
name = "devmind-ai"
version = "0.1.0"
description = "Local-first modular AI learning platform foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "DevMind AI contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pymongo>=4.9.0",
  "python-json-logger>=2.0.7",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[project.scripts]
devmind-check-environment = "scripts.check_environment:main"
devmind-worker = "devmind_worker.runner:main"

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "services/api/src",
  "services/worker/src",
  "services/model_gateway/src",
  "packages/shared_python/src",
  ".",
]
include = ["devmind_*", "scripts"]

[tool.pytest.ini_options]
testpaths = [
  "services/api/tests",
  "services/worker/tests",
  "services/model_gateway/tests",
  "tests",
]
asyncio_mode = "auto"
markers = [
  "mongodb: requires explicit MONGODB_TEST_URI and safe test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "services/api/src",
  "services/worker/src",
  "services/model_gateway/src",
  "packages/shared_python/src",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
mypy_path = [
  "services/api/src",
  "services/worker/src",
  "services/model_gateway/src",
  "packages/shared_python/src",
]
files = [
  "services/api/src",
  "services/worker/src",
  "services/model_gateway/src",
  "packages/shared_python/src",
  "scripts",
]

[[tool.mypy.overrides]]
module = ["pymongo.*"]
ignore_missing_imports = true
